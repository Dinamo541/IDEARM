name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # release.yml runs these same tests before it packages a tag.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # TASM, MASM, MSYS2 and DOSBox are not on the runner: the requires-* tests run locally with -Plocal-tools.
      - name: Build and test
        run: mvn -B verify

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # The Linux workflow with real tools: NASM, GNU ld and GDB for native programs, and the distribution's DOSBox
      # (0.74-3) for DOS programs. Xvfb gives DOSBox and JavaFX a display; xvfb-run needs xauth. Reproduced locally
      # in Docker on 2026-09-22 (spikes/REPORT.md, S7).
      - name: Install NASM, GDB, DOSBox and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm binutils gdb dosbox xvfb xauth

      # Borland and Microsoft tools cannot be redistributed, so only their tests are left out.
      - name: Build and test
        run: xvfb-run -a mvn -B verify -DexcludedGroups=requires-tasm,requires-masm
